<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOWAITOGURE</title>
  
  <!-- 引入韓系字體與 CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>

  <!-- 頁首 Header -->
  <header class="head wrap">
    <h1><a href="#">灰力彩得主 Howitogure</a></h1>
    <p>Blank skin test blog</p>

    <!-- 選單區塊 -->
    <div class="acts">
      <span class="square-icon"></span>
      <a class="act" href="#">Category</a>
      <a class="act" href="#">Tag</a>
      <a class="act" href="#">Notice</a>
      <a class="act" href="#">Write</a>
      <a class="act" href="#">Manage</a>
      
      <div class="search">
        <input class="search-i" type="search" placeholder="Search">
      </div>
    </div>
  </header>

  <!-- 3 列 1:1 IG 風格照片網格 -->
  <main class="posts wrap">

    <article class="post">
      <a class="thumb" href="#">
        <img src="https://picsum.photos/500/500?random=1" alt="Post 1">
      </a>
      <div class="meta">유튜브 업로드 테스트</div>
    </article>

    <article class="post">
      <a class="thumb" href="#">
        <img src="https://picsum.photos/500/500?random=2" alt="Post 2">
      </a>
      <div class="meta">태그 테스트</div>
    </article>

    <article class="post">
      <a class="thumb" href="#">
        <img src="https://picsum.photos/500/500?random=3" alt="Post 3">
      </a>
      <div class="meta">post test</div>
    </article>

    <article class="post">
      <a class="thumb" href="#">
        <img src="https://picsum.photos/500/500?random=4" alt="Post 4">
      </a>
      <div class="meta">Minimal Layout</div>
    </article>

    <article class="post">
      <a class="thumb" href="#">
        <img src="https://picsum.photos/500/500?random=5" alt="Post 5">
      </a>
      <div class="meta">Butterfly Lab</div>
    </article>

    <article class="post">
      <a class="thumb" href="#">
        <img src="https://picsum.photos/500/500?random=6" alt="Post 6">
      </a>
      <div class="meta">Pixel Art</div>
    </article>

  </main>

  <!-- 頁尾 -->
  <footer class="foot wrap">
    <p class="copy">© HOWAITOGURE</p>
  </footer>

</body>
</html>
