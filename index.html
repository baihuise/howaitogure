<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOWAITOGURE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 頁首 Header -->
  <header class="head wrap">
    <h1><a href="#">HOWAITOGURE</a></h1>
    <p>Minimal skin test blog</p>

    <!-- 選單區塊 -->
    <div class="acts">
      <span class="square-icon"></span>
      <a class="act" href="#">Category</a>
      <a class="act" href="#">Tag</a>
      <a class="act" href="#">Notice</a>
      <a class="act" href="#">Write</a>
      <a class="act" href="#">Manage</a>
      
      <div class="search">
        <input class="search-i" type="search" placeholder="Search">
      </div>
    </div>
  </header>

  <!-- IG 網格卡片區 (3列 1:1 正方形) -->
  <main class="posts wrap">

    <article class="post">
      <a class="thumb" href="#">
        <img src="https://picsum.photos/500/500?random=1" alt="Post 1">
      </a>
      <div class="meta">
        <span class="meta-t">유튜브 업로드 테스트</span>
      </div>
    </article>

    <article class="post">
      <a class="thumb" href="#">
        <img src="https://picsum.photos/500/500?random=2" alt="Post 2">
      </a>
      <div class="meta">
        <span class="meta-t">태그 테스트</span>
      </div>
    </article>

    <article class="post">
      <a class="thumb" href="#">
        <img src="https://picsum.photos/500/500?random=3" alt="Post 3">
      </a>
      <div class="meta">
        <span class="meta-t">post test</span>
      </div>
    </article>

    <article class="post">
      <a class="thumb" href="#">
        <img src="https://picsum.photos/500/500?random=4" alt="Post 4">
      </a>
      <div class="meta">
        <span class="meta-t">Minimal Layout</span>
      </div>
    </article>

    <article class="post">
      <a class="thumb" href="#">
        <img src="https://picsum.photos/500/500?random=5" alt="Post 5">
      </a>
      <div class="meta">
        <span class="meta-t">Butterfly Lab</span>
      </div>
    </article>

    <article class="post">
      <a class="thumb" href="#">
        <img src="https://picsum.photos/500/500?random=6" alt="Post 6">
      </a>
      <div class="meta">
        <span class="meta-t">Pixel Art</span>
      </div>
    </article>

  </main>

  <!-- 頁尾 Footer -->
  <footer class="foot wrap">
    <p class="copy">© HOWAITOGURE</p>
  </footer>

</body>
</html>
